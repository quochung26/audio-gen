name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # packages/audio's tests run REAL ffmpeg rather than a mock: the easy thing to get
      # wrong there is the filter chain, and a filter chain only goes wrong when ffmpeg
      # runs. Mocking it and comparing argument strings leaves a broken filter green.
      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          ffmpeg -hide_banner -filters | grep -qE 'sidechaincompress' || {
            echo "ffmpeg is missing sidechaincompress"; exit 1; }

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # `prisma generate` runs at postinstall and does NOT need DATABASE_URL.
      # The three steps below need no Postgres/Redis either — there are no DB integration tests yet.
      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
