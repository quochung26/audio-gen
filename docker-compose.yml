# Tên project ghim cứng, KHÔNG để Docker suy từ tên thư mục.
#
# Không có dòng này thì đổi tên thư mục dự án là `docker compose` mất dấu
# container và volume đang chạy — nó đi tìm project mới rồi dựng DB rỗng, còn
# dữ liệu cũ nằm lại trong volume của project cũ. Đã dính đúng lỗi này khi
# thư mục đổi từ `audio` sang `audio-gen`.
name: audio

services:
  postgres:
    # pgvector thay cho postgres thường: tìm tập cũ liên quan bằng vector
    # search thay vì nhồi mọi tóm tắt vào ngữ cảnh. Xem docs/database.md.
    image: pgvector/pgvector:pg17
    container_name: audio-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: dev
      POSTGRES_DB: audio_truyen
    ports: ["5433:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d audio_truyen"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: audio-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["6380:6379"]
    volumes: ["redisdata:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
  redisdata:
