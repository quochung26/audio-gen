# The project name is pinned, NOT inferred by Docker from the directory name.
#
# Without this line, renaming the project directory makes `docker compose` lose track of
# the running containers and volumes — it looks for a new project and stands up an empty
# DB, while the old data stays in the old project's volume. This exact bug happened when
# the directory went from `audio` to `audio-gen`.
name: audio

services:
  postgres:
    # pgvector rather than plain postgres: related earlier episodes are found by vector
    # search instead of stuffing every summary into the context. See docs/database.md.
    image: pgvector/pgvector:pg17
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: dev
      POSTGRES_DB: audio_truyen
    ports: ["5433:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d audio_truyen"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["6380:6379"]
    volumes: ["redisdata:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
  redisdata:
